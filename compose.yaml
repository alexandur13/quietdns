name: quietdns
services:
  quietdns:
    build: .
    image: quietdns:local
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:${DNS_PORT:-53}:1053/udp"
      - "${BIND_IP:-127.0.0.1}:${DNS_PORT:-53}:1053/tcp"
      - "${BIND_IP:-127.0.0.1}:${HTTP_PORT:-8081}:8080/tcp"
    environment:
      BIND_IP: "${BIND_IP:-127.0.0.1}"
      SETUP_TOKEN: "${SETUP_TOKEN:-}"
      GOMEMLIMIT: 160MiB
    volumes:
      - data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "/quietdns", "check"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  data:
